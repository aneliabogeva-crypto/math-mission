name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit and API tests
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee ../maven.log
      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          # Compile errors: [ERROR] /path/File.java:[line,col] message
          grep -E '^\[ERROR\] /.*\.java:\[[0-9]+' maven.log | head -40 | sed -E 's#^\[ERROR\] .*/(backend/[^:]+):\[([0-9]+),[0-9]+\] (.*)#::error file=\1,line=\2::\3#' || true
          # Test failures and other errors (first lines)
          grep -E '^\[ERROR\] (Tests run|  |Failures|Errors|[A-Za-z]+Test\.|.*FAIL)' maven.log | head -40 | sed -E 's#^\[ERROR\] (.*)#::error::\1#' || true
          for f in backend/target/surefire-reports/*.txt; do [ -f "$f" ] && grep -A12 -E '<<< (FAILURE|ERROR)' "$f" | head -60 | tr '\n' ' ' | sed -E 's#(.*)#::error title='"$(basename $f)"'::\1#'; echo; done || true
          grep -E 'Caused by|APPLICATION FAILED|Description:|Action:' -A3 maven.log | head -30 | tr '\n' ' ' | sed -E 's#(.+)#::error title=startup::\1#' || true
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: surefire-reports, path: backend/target/surefire-reports }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the all-in-one image
        run: docker build -t math-mission .
