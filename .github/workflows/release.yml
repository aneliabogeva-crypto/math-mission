name: Desktop installers

# Builds self-contained installers (bundled Java runtime) and attaches them to a GitHub Release.
# Runs on every push to main (updates the "Math Mission <version>" release), on version tags, or manually.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_VERSION: 1.0.0

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest
            label: macos-apple-silicon
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25', cache: maven }

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build web app and server
        shell: bash
        run: |
          (cd frontend && npm install --no-audit --no-fund && npm run build)
          rm -rf backend/src/main/resources/static && cp -r frontend/dist backend/src/main/resources/static
          (cd backend && mvn -B -q package -DskipTests)
          mkdir -p staging && cp backend/target/math-mission-backend-*.jar staging/app.jar

      - name: Common jpackage options
        shell: bash
        run: |
          echo 'JP_OPTS=--name MathMission --app-version ${{ env.APP_VERSION }} --vendor "Math Mission" --description "Math Mission - algebra for Grade 7" --input staging --main-jar app.jar --java-options -Dmathmission.desktop=true --java-options -Xmx512m --dest out' >> "$GITHUB_ENV"

      # ---------------- Windows
      - name: Windows portable (zip)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          eval jpackage $JP_OPTS --type app-image --icon packaging/math-mission.ico
          (cd out && 7z a -tzip ../MathMission-${APP_VERSION}-windows-portable.zip MathMission > /dev/null)
      - name: Install WiX for the MSI installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
      - name: Windows installer (msi)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          rm -rf out/MathMission
          eval jpackage $JP_OPTS --type msi --icon packaging/math-mission.ico --win-menu --win-shortcut \
            --win-per-user-install --win-dir-chooser --win-menu-group "Math Mission" \
            --win-upgrade-uuid 6f0b6a1e-2c55-4c55-9a8e-3c2b8d1e7a10
          mv out/*.msi MathMission-${APP_VERSION}-windows.msi

      # ---------------- macOS
      - name: macOS disk image (dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do sips -z $s $s packaging/math-mission.png --out icon.iconset/icon_${s}x${s}.png > /dev/null; done
          cp icon.iconset/icon_32x32.png icon.iconset/icon_16x16@2x.png
          cp icon.iconset/icon_64x64.png icon.iconset/icon_32x32@2x.png
          cp icon.iconset/icon_256x256.png icon.iconset/icon_128x128@2x.png
          cp icon.iconset/icon_512x512.png icon.iconset/icon_256x256@2x.png
          rm icon.iconset/icon_64x64.png
          iconutil -c icns icon.iconset -o math-mission.icns
          eval jpackage $JP_OPTS --type dmg --icon math-mission.icns --mac-package-name "Math Mission"
          mv out/*.dmg MathMission-${APP_VERSION}-macos-apple-silicon.dmg

      # ---------------- Linux
      - name: Linux package (deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          eval jpackage $JP_OPTS --type deb --icon packaging/math-mission.png --linux-shortcut --linux-menu-group Education
          mv out/*.deb MathMission-${APP_VERSION}-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: |
            MathMission-*.msi
            MathMission-*.zip
            MathMission-*.dmg
            MathMission-*.deb
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: Math Mission ${{ env.APP_VERSION }}
          make_latest: true
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: dist/*
          body: |
            **Install Math Mission on your computer.** Each download contains everything it needs, including its own Java runtime.

            | Computer | Download |
            |---|---|
            | Windows | `MathMission-…-windows.msi` (installer), or `…-windows-portable.zip` (unzip, then run `MathMission\MathMission.exe`) |
            | Mac (Apple Silicon) | `MathMission-…-macos-apple-silicon.dmg` |
            | Linux | `MathMission-…-linux-amd64.deb` |

            Starting the app opens Math Mission in your browser at http://localhost:18080 and adds an icon to the system tray or menu bar (Open / Quit).
            Your data stays on this computer in the `MathMission` folder in your home directory.

            The installers are not code-signed yet:
            * **Windows:** if SmartScreen appears, click "More info" → "Run anyway".
            * **Mac:** if macOS says it can't verify the app, open System Settings → Privacy & Security → "Open Anyway".
