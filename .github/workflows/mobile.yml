name: Phone website

# Builds the standalone version (everything runs on the device, works offline):
#  * publishes it to GitHub Pages → open on any phone and "Add to Home Screen"
#  (the Android APK is built by the "Desktop installers" workflow and published with the release)
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build phone version for GitHub Pages
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
          VITE_BASE: /math-mission/
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html   # client-side routes on GitHub Pages
          echo "{\"version\":\"$GITHUB_SHA\"}" > dist/version.json   # lets installed copies detect a new version
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
