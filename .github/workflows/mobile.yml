name: Mobile (phone app + Android APK)

# Builds the standalone version (everything runs on the device, works offline):
#  * publishes it to GitHub Pages → open on any phone and "Add to Home Screen"
#  * builds an Android APK and attaches it to the latest release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build phone version for GitHub Pages
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
          VITE_BASE: /math-mission/
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html   # client-side routes on GitHub Pages
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Build phone version for the app
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm run build
      - name: Create Android project
        working-directory: frontend
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#4338ca' --splashBackgroundColor '#f6f5fb' || echo "::warning::Icon generation skipped"
          npx cap sync android
      - name: Build APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk ../../MathMission-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: MathMission-android.apk }
      - name: Attach APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: MathMission-android.apk
          overwrite_files: true
