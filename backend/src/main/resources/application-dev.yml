# Zero-setup local profile: file-based H2 in PostgreSQL mode. Use the "postgres" profile for real persistence.
spring:
  datasource:
    url: jdbc:h2:file:./data/mathmission;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

mathmission:
  dev-accounts:
    # Staff demo accounts created on first start (dev profile only). Change or remove for any shared environment.
    enabled: true
    password: "Demo-2026!"
    # Base32 TOTP secret for the demo admin, so MFA can be exercised with any authenticator app.
    admin-totp-secret: "JBSWY3DPEHPK3PXP"
